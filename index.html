<!DOCTYPE html>
<html lang="eng">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="/socket.io/socket.io.js"></script>

    <script src="library_folder/dist/library.min.js"></script>
    
    <title>As You Wish</title>
  </head>
  <body>
    <div id="main">
      <input id="scaleSlider" type="range" min="0.5" max="2" step="0.1" >
      <input id="rotationSlider" type="range" min="-180" max="180" step="1" >
      <input id="skewSlider" type="range" min="-80" max="80" step="1" value="0">
      

      <audio id="laughter" src="laughing.m4a" loop></audio>
      <audio id="crying" src="crying.m4a" loop></audio>
      <audio id="whisper" src="whisper.mp3" loop></audio>

      <div id="leftEye">
        <img src="left-eye.png">
      </div>

      <div id="rightEye">
        <img src="right-eye.png">
      </div>

      <div id="smile">
        <img src="smile2.png">
      </div>

      <button id="restartBtn">Restart</button>

 

    </div>

    <div id="blackBackground"></div>

    <div id="realMonroe">
      <img src="realMonroe2.jpeg">
      <img id="ghost" src="realMonroe2.jpeg">

      <p id="glitchText">Wait! I'm not finished!!</p>
    </div>

    <div id="blackScreen">
      <p>You didn't even hesitate to change me.</p>
      <p>It was second nature to you.</p>
    </div>

    <div id="finalScreen">
      <p id="finalWords">I̷ d̸o̷n̶'̷t̸ w̷a̶n̸t̷ t̸o̷ d̶i̸s̷a̶p̸p̷e̶a̸r̷ a̶g̸a̷i̶n̸.</p>

      <p id="errorText">404: /user-not-found</p>

    </div>


    <script src="sketch.js"></script>
  </body>
</html>
