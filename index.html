<!DOCTYPE html>
<html lang="eng">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
    <title>spinny thing</title>
  </head>
  <body>
    <div id="main">
      <input id="scaleSlider" type="range" min="0.5" max="2" step="0.1" >
      <input id="rotationSlider" type="range" min="-180" max="180" step="1" >
      <input id="skewSlider" type="range" min="-80" max="80" step="1" value="0">

      <audio id="laughter" src="laughing.mp3" loop></audio>
      <audio id="crying" src="crying.mp3" loop></audio>

      <div id="leftEye">
        <img src="left-eye.png">
      </div>

      <div id="rightEye">
        <img src="right-eye.png">
      </div>

      <div id="smile">
        <img src="smile2.png">
      </div>

      

    </div>
    <script src="sketch.js"></script>
  </body>
</html>
